<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltEdge Electronics | Premium Parts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .hardware-img { width: 100%; height: 180px; object-fit: contain; transition: transform 0.4s ease; }
        .product-card:hover .hardware-img { transform: scale(1.08); }
        .glass-nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900" x-data="voltEdgeApp()" x-init="init()">

    <nav class="glass-nav text-white p-4 flex justify-between items-center shadow-2xl sticky top-0 z-50 border-b border-slate-700">
        <div class="flex items-center gap-2">
            <span class="bg-blue-600 text-white p-1 rounded font-black">VE</span>
            <h1 class="text-xl font-black tracking-tighter uppercase">VoltEdge</h1>
        </div>
        <div class="flex items-center gap-4">
            <template x-if="user">
                <div class="flex items-center gap-3">
                    <span class="hidden md:block text-[10px] font-bold text-slate-400 uppercase">Active: <span class="text-white" x-text="user.name"></span></span>
                    <button @click="logout()" class="text-red-400 text-[10px] font-black border border-red-400/30 px-2 py-1 rounded hover:bg-red-400/10 transition">LOGOUT</button>
                </div>
            </template>
            <button @click="showAdminModal = true" class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-[10px] font-bold uppercase tracking-widest border border-slate-600">Admin</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 md:p-8">
        
        <div x-show="!user && view === 'shop'" x-cloak class="max-w-md mx-auto mt-12">
            <div class="bg-white p-8 rounded-[2rem] shadow-2xl border border-slate-200">
                <div class="flex border-b mb-8">
                    <button @click="authMode = 'login'" :class="authMode === 'login' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'" class="flex-1 pb-4 font-black uppercase text-xs tracking-widest transition-all border-b-2">Login</button>
                    <button @click="authMode = 'register'" :class="authMode === 'register' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'" class="flex-1 pb-4 font-black uppercase text-xs tracking-widest transition-all border-b-2">Create Account</button>
                </div>

                <div class="space-y-5">
                    <div x-show="authMode === 'register'">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Full Name</label>
                        <input type="text" x-model="authForm.name" placeholder="John Doe" class="w-full border-2 border-slate-50 p-4 rounded-2xl outline-none focus:border-blue-500 bg-slate-50 transition-all font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Phone Number</label>
                        <input type="tel" x-model="authForm.phone" placeholder="024XXXXXXX" class="w-full border-2 border-slate-50 p-4 rounded-2xl outline-none focus:border-blue-500 bg-slate-50 transition-all font-bold">
                    </div>
                    <button @click="handleAuth()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all" x-text="authMode === 'register' ? 'Register Account' : 'Login to Shop'"></button>
                </div>
            </div>
        </div>

        <div x-show="user && view === 'shop'" x-cloak class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                <template x-for="item in products" :key="item.name">
                    <div class="product-card bg-white rounded-[2rem] border border-slate-200 shadow-sm overflow-hidden flex flex-col hover:shadow-2xl transition-all group">
                        <div class="bg-slate-50 h-52 flex items-center justify-center p-8 relative overflow-hidden">
                            <img :src="'/' + encodeURIComponent(item.image)" :alt="item.name" class="hardware-img" onerror="this.src='https://via.placeholder.com/256?text=Hardware'">
                            <div class="absolute top-4 right-4 bg-slate-900 text-white text-[10px] font-black px-3 py-1 rounded-full shadow-xl" x-text="'GH₵ ' + item.price"></div>
                        </div>
                        <div class="p-6 flex-grow flex flex-col justify-between">
                            <div>
                                <p class="text-[9px] font-black text-blue-600 uppercase tracking-[0.2em] mb-1" x-text="item.category"></p>
                                <h3 class="font-black text-slate-800 text-lg leading-tight mb-4" x-text="item.name"></h3>
                            </div>
                            <button 
                                @click="placeOrder(item)" 
                                :disabled="isOrdering"
                                class="w-full bg-slate-900 group-hover:bg-blue-600 text-white py-3 rounded-xl text-xs font-black transition-colors uppercase tracking-widest"
                                x-text="isOrdering ? 'Processing...' : 'Order Now'">
                            </button>
                        </div>
                    </div>
                </template>
            </div>
            
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200 sticky top-24">
                    <h3 class="font-black text-slate-900 mb-6 flex items-center justify-between">
                        <span class="tracking-tighter">MY RECENT ORDERS</span>
                        <span class="bg-blue-100 text-blue-600 text-[10px] px-2 py-1 rounded-lg" x-text="myOrders.length"></span>
                    </h3>
                    <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                        <template x-for="o in myOrders" :key="o.id">
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 relative overflow-hidden shadow-sm">
                                <div :class="o.confirmed ? 'bg-green-500' : 'bg-amber-500'" class="absolute top-0 left-0 w-1 h-full"></div>
                                <div class="flex flex-col mb-1">
                                    <span class="text-[11px] font-black text-slate-700 uppercase leading-tight" x-text="o.itemName"></span>
                                    <span class="text-[9px] font-mono text-slate-400" x-text="o.timestamp"></span>
                                </div>
                                <div class="mt-2 flex flex-col gap-2">
                                    <span :class="o.confirmed ? 'text-green-600' : 'text-amber-600'" class="text-[9px] font-black uppercase tracking-widest" x-text="o.confirmed ? 'ORDER CONFIRMED' : 'WAITING CONFIRMATION'"></span>
                                    
                                    <button x-show="o.confirmed && !o.feedback" @click="leaveComment(o.id)" class="text-[9px] bg-blue-600 text-white px-2 py-1 rounded font-bold uppercase w-max">Leave Comment</button>
                                    <div x-show="o.feedback" class="text-[9px] italic text-slate-500 bg-white p-1 rounded" x-text="'Msg: ' + o.feedback"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <div x-show="view === 'admin'" x-cloak class="max-w-6xl mx-auto bg-indigo-900 p-8 rounded-[2.5rem] shadow-2xl border border-indigo-700 text-white">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                <div>
                    <h2 class="text-3xl font-black text-white tracking-tighter italic uppercase">Admin Control Panel</h2>
                    <p class="text-indigo-300 text-xs font-bold uppercase tracking-widest">Order Management System</p>
                </div>
                <button @click="view = 'shop'" class="bg-indigo-700 px-6 py-2 rounded-xl text-white font-black text-[10px] uppercase tracking-widest hover:bg-indigo-600 transition border border-indigo-500">Return to Store</button>
            </div>
            
            <div class="overflow-x-auto bg-indigo-950 rounded-3xl p-4">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] text-indigo-400 uppercase tracking-widest border-b border-indigo-800">
                            <th class="p-4">Customer Info</th>
                            <th class="p-4">Item & Price</th>
                            <th class="p-4">Date/Time</th>
                            <th class="p-4">Comments</th>
                            <th class="p-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-indigo-900">
                        <template x-for="o in allOrders" :key="o.id">
                            <tr class="hover:bg-indigo-900/50 transition-colors">
                                <td class="p-4">
                                    <div class="font-black text-white uppercase text-sm" x-text="o.customerName || o.customer"></div>
                                    <div class="font-bold text-indigo-400 text-sm" x-text="o.customerPhone || o.phone"></div>
                                </td>
                                <td class="p-4">
                                    <div class="font-bold text-xs text-indigo-100 uppercase" x-text="o.itemName"></div>
                                    <div class="text-[10px] text-indigo-400" x-text="'GH₵ ' + o.price"></div>
                                </td>
                                <td class="p-4 font-mono text-[10px] text-indigo-300" x-text="o.timestamp"></td>
                                <td class="p-4">
                                    <div class="text-[11px] italic text-amber-300 max-w-[150px]" x-text="o.feedback || 'No comments'"></div>
                                </td>
                                <td class="p-4 text-center">
                                    <button x-show="!o.confirmed" @click="confirmOrder(o.id)" class="bg-emerald-500 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-emerald-400 transition-all">Approve</button>
                                    <span x-show="o.confirmed" class="text-emerald-400 font-black text-[10px] uppercase italic">Confirmed ✓</span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div x-show="showAdminModal" x-cloak class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-[100]">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm">
            <h3 class="font-black text-2xl mb-4 text-center">ADMIN ACCESS</h3>
            <input type="password" x-model="adminPassInput" class="w-full border-2 p-4 rounded-2xl mb-6 text-center text-3xl outline-none focus:border-blue-500 font-black" placeholder="••••">
            <div class="flex gap-3">
                <button @click="showAdminModal = false" class="flex-1 bg-slate-100 py-4 rounded-2xl font-black text-[10px] uppercase">Abort</button>
                <button @click="adminLogin()" class="flex-1 bg-slate-900 text-white py-4 rounded-2xl font-black text-[10px] uppercase">Verify</button>
            </div>
        </div>
    </div>

    <script>
        function voltEdgeApp() {
            return {
                view: 'shop', authMode: 'login', user: null,
                authForm: {name: '', phone: ''},
                showAdminModal: false, adminPassInput: '',
                isOrdering: false, 
                myOrders: [], allOrders: [],
                products: [
                    {name:'HP Pavilion 15 Motherboard', price:1100, category: 'Hardware', image: 'HP-Pavilion-15.jpg'},
                    {name:'256GB SSD', price:250, category: 'Storage', image: 'ssd-256.jpg'},
                    {name:'512GB SSD', price:450, category: 'Storage', image: 'ssd-512.jpg'},
                    {name:'HP Envy laptop battery', price:380, category: 'Power', image: 'HP-Envy laptop battery.jpg'},
                    {name:'1TB HDD', price:400, category: 'Storage', image: 'hdd-1tb.jpg'},
                    {name:'DIY Kit', price:290, category: 'Electronics', image: 'diy-electronic-kit .jpg'},
                    {name:'Dell Vostro N411Z Battery', price:350, category: 'Power', image: 'Dell Vostro N411Z battry.jpg'}
                ],

                init() {
                    const session = localStorage.getItem('voltEdgeSession');
                    if(session) {
                        this.user = JSON.parse(session);
                        this.loadOrders();
                    }
                    setInterval(() => this.loadOrders(), 5000);
                },

                async handleAuth() {
                    if(!this.authForm.phone || (this.authMode === 'register' && !this.authForm.name)) return alert("Fill all details");
                    const endpoint = this.authMode === 'register' ? '/api/register' : '/api/login';
                    try {
                        const res = await fetch(endpoint, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(this.authForm)
                        });
                        const data = await res.json();
                        if (res.ok) {
                            this.user = data.user;
                            localStorage.setItem('voltEdgeSession', JSON.stringify(this.user));
                            this.loadOrders();
                        } else alert(data.error);
                    } catch (e) { alert("Server Error"); }
                },

                async loadOrders() {
                    if(!this.user) return;
                    try {
                        const res = await fetch(`/api/my-orders/${this.user.phone}`);
                        if(res.ok) this.myOrders = await res.json();
                        
                        if(this.view === 'admin') {
                            const adminRes = await fetch('/api/admin/verify', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({ password: 'G1234' }) 
                            });
                            const data = await adminRes.json();
                            if(data.success) this.allOrders = data.orders;
                        }
                    } catch(e) { console.log("Syncing..."); }
                },

                async placeOrder(item) {
                    this.isOrdering = true;
                    try {
                        const res = await fetch('/api/orders', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                phone: this.user.phone,
                                itemName: item.name,
                                price: item.price
                            })
                        });
                        if(res.ok) { alert("Order Placed!"); this.loadOrders(); }
                    } finally { this.isOrdering = false; }
                },

                async confirmOrder(id) {
                    await fetch(`/api/orders/${id}/confirm`, {
                        method: 'PATCH',
                        headers: {'Content-Type': 'application/json'}
                    });
                    this.loadOrders();
                },

                async leaveComment(id) {
                    const msg = prompt("Enter your comment for the administrator:");
                    if(!msg) return;
                    await fetch(`/api/orders/${id}/feedback`, {
                        method: 'PATCH',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ feedback: msg })
                    });
                    this.loadOrders();
                },

                adminLogin() {
                    if(this.adminPassInput === 'G1234') {
                        this.view = 'admin';
                        this.showAdminModal = false;
                        this.loadOrders();
                    } else alert("Invalid Password");
                },

                logout() {
                    localStorage.removeItem('voltEdgeSession');
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
