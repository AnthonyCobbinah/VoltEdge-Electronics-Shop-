<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltEdge Electronics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .hardware-img { width: 100%; height: 160px; object-fit: contain; }
        .admin-violet { background-color: #7c3aed; } /* Violet 600 */
    </style>
</head>
<body class="bg-slate-50 font-sans" x-data="voltEdgeApp()" x-init="init()">

    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-black italic">VOLTEDGE</h1>
        <div class="flex gap-4">
            <template x-if="user"><button @click="logout()" class="text-xs font-bold text-red-400">LOGOUT</button></template>
            <button @click="showAdminModal = true" class="text-xs bg-violet-600 px-3 py-1 rounded font-bold">ADMIN</button>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <div x-show="user && view === 'shop'" class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-4">
                <template x-for="item in products">
                    <div class="bg-white p-4 rounded-3xl border shadow-sm">
                        <img :src="'/' + encodeURIComponent(item.image)" class="hardware-img mb-4">
                        <h3 class="font-bold text-sm" x-text="item.name"></h3>
                        <p class="text-violet-600 font-black mb-3" x-text="'GH₵ ' + item.price"></p>
                        <button @click="placeOrder(item)" class="w-full bg-slate-900 text-white py-2 rounded-xl text-xs font-bold">ORDER</button>
                    </div>
                </template>
            </div>

            <div class="lg:col-span-1 bg-white p-6 rounded-3xl border shadow-sm h-fit">
                <h2 class="font-black text-xs mb-4 uppercase tracking-widest">My Orders</h2>
                <div class="space-y-3">
                    <template x-for="o in myOrders">
                        <div class="p-3 rounded-xl border relative overflow-hidden" :class="o.status === 'out-of-stock' ? 'bg-red-50 border-red-200' : 'bg-slate-50'">
                            <p class="text-[11px] font-bold" x-text="o.itemName"></p>
                            
                            <div class="mt-1">
                                <span x-show="o.status === 'pending'" class="text-[9px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold">PENDING</span>
                                <span x-show="o.status === 'confirmed'" class="text-[9px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">CONFIRMED</span>
                                <span x-show="o.status === 'out-of-stock'" class="text-[9px] bg-red-600 text-white px-2 py-0.5 rounded-full font-bold">OUT OF STOCK</span>
                            </div>

                            <button x-show="o.status === 'confirmed' && !o.feedback" @click="leaveComment(o.id)" class="mt-2 text-[9px] text-violet-600 font-bold underline">Add Comment</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div x-show="view === 'admin'" x-cloak class="bg-white rounded-[2rem] shadow-2xl border-4 border-violet-600 overflow-hidden">
            <div class="admin-violet p-6 text-white flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-black italic">VIOLET ADMIN PANEL</h2>
                    <p class="text-[10px] font-bold opacity-80 uppercase">Inventory & Order Management</p>
                </div>
                <button @click="view = 'shop'" class="bg-white text-violet-600 px-4 py-2 rounded-lg font-black text-xs">EXIT</button>
            </div>

            <table class="w-full">
                <thead>
                    <tr class="bg-violet-50 text-violet-900 text-[10px] font-black uppercase">
                        <th class="p-4 text-left">Customer (Phone)</th>
                        <th class="p-4 text-left">Item</th>
                        <th class="p-4 text-left">Status</th>
                        <th class="p-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-violet-100">
                    <template x-for="o in allOrders" :key="o.id">
                        <tr class="hover:bg-violet-50/50 transition">
                            <td class="p-4">
                                <div class="font-black text-slate-900 text-base" x-text="o.customerName"></div>
                                <div class="font-bold text-violet-600 text-sm italic" x-text="o.customerPhone"></div>
                            </td>
                            <td class="p-4">
                                <div class="text-xs font-bold" x-text="o.itemName"></div>
                                <div class="text-[10px] text-slate-400" x-text="o.timestamp"></div>
                            </td>
                            <td class="p-4">
                                <span :class="{
                                    'bg-amber-100 text-amber-700': o.status === 'pending',
                                    'bg-green-100 text-green-700': o.status === 'confirmed',
                                    'bg-red-100 text-red-700': o.status === 'out-of-stock'
                                }" class="text-[9px] font-black px-2 py-1 rounded uppercase" x-text="o.status"></span>
                            </td>
                            <td class="p-4">
                                <div class="flex justify-center gap-2">
                                    <button @click="updateStatus(o.id, 'confirmed')" class="bg-green-500 text-white p-2 rounded-lg text-[10px] font-bold">CONFIRM</button>
                                    <button @click="updateStatus(o.id, 'out-of-stock')" class="bg-orange-500 text-white p-2 rounded-lg text-[10px] font-bold uppercase">No Stock</button>
                                    <button @click="deleteOrder(o.id)" class="bg-red-600 text-white p-2 rounded-lg text-[10px] font-bold">DELETE</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <div x-show="showAdminModal" x-cloak class="fixed inset-0 bg-slate-900/80 backdrop-blur flex items-center justify-center p-4 z-[100]">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-xs text-center">
            <h3 class="font-black mb-4">ADMIN ACCESS</h3>
            <input type="password" x-model="adminPassInput" class="w-full border-2 p-3 rounded-xl mb-4 text-center font-black">
            <button @click="adminLogin()" class="w-full bg-violet-600 text-white py-3 rounded-xl font-bold">LOGIN</button>
            <button @click="showAdminModal = false" class="mt-2 text-xs text-slate-400">Cancel</button>
        </div>
    </div>

    <script>
        function voltEdgeApp() {
            return {
                view: 'shop', user: null, showAdminModal: false, adminPassInput: '',
                myOrders: [], allOrders: [],
                products: [
                    {name:'HP Pavilion 15 Motherboard', price:1100, image: 'HP-Pavilion-15.jpg'},
                    {name:'256GB SSD', price:250, image: 'ssd-256.jpg'},
                    {name:'512GB SSD', price:450, image: 'ssd-512.jpg'},
                    {name:'HP Envy laptop battery', price:380, image: 'HP-Envy laptop battery.jpg'},
                    {name:'1TB HDD', price:400, image: 'hdd-1tb.jpg'},
                    {name:'DIY Kit', price:290, image: 'diy-electronic-kit .jpg'},
                    {name:'Dell Vostro N411Z Battery', price:350, image: 'Dell Vostro N411Z battry.jpg'}
                ],

                init() {
                    const session = localStorage.getItem('voltEdgeSession');
                    if(session) { this.user = JSON.parse(session); this.loadOrders(); }
                    setInterval(() => this.loadOrders(), 5000);
                },

                async loadOrders() {
                    if(!this.user) return;
                    const res = await fetch(`/api/my-orders/${this.user.phone}`);
                    if(res.ok) this.myOrders = await res.json();
                    if(this.view === 'admin') this.adminFetch();
                },

                async adminFetch() {
                    const res = await fetch('/api/admin/verify', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ password: 'G1234' })
                    });
                    const data = await res.json();
                    if(data.success) this.allOrders = data.orders;
                },

                async placeOrder(item) {
                    await fetch('/api/orders', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ phone: this.user.phone, itemName: item.name, price: item.price })
                    });
                    this.loadOrders();
                    alert("Order Placed!");
                },

                async updateStatus(id, status) {
                    await fetch(`/api/orders/${id}/status`, {
                        method: 'PATCH',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ status })
                    });
                    this.adminFetch();
                },

                async deleteOrder(id) {
                    if(!confirm("Delete this order?")) return;
                    await fetch(`/api/orders/${id}`, { method: 'DELETE' });
                    this.adminFetch();
                },

                adminLogin() {
                    if(this.adminPassInput === 'G1234') {
                        this.view = 'admin';
                        this.showAdminModal = false;
                        this.adminFetch();
                    } else alert("Wrong Password");
                },

                logout() { localStorage.removeItem('voltEdgeSession'); location.reload(); }
            }
        }
    </script>
</body>
</html>
